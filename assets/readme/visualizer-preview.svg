<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="578" viewBox="0 0 1240 578" role="img" aria-labelledby="t d">
<title id="t">GearEx Code Visualizer workspace preview</title>
<desc id="d">An illustrative overview of GearEx: Python code on the left, call stack and heap memory on the right, with next and previous step controls.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#112027"/><stop offset="1" stop-color="#0b141a"/></linearGradient><linearGradient id="edge" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#00b8ac"/><stop offset="1" stop-color="#5d83a2"/></linearGradient></defs>
<rect width="1240" height="578" rx="26" fill="url(#bg)"/><rect x="22" y="22" width="1196" height="534" rx="17" fill="#16262d" stroke="#325059" stroke-width="1.5"/>
<rect x="22" y="22" width="1196" height="70" rx="17" fill="#1d3038"/><rect x="22" y="72" width="1196" height="20" fill="#1d3038"/><path d="M22 92H1218" stroke="#34535a"/>
<text x="50" y="66" font-size="22" font-weight="800" fill="#f0faf9" font-family="Arial,sans-serif">GEAREX</text>
<text x="163" y="65" font-size="13" letter-spacing="2" font-weight="700" fill="#8caeb3" font-family="monospace">/ CODE VISUALIZER</text>
