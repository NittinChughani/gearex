<text x="53" y="130" fill="#b3ccd0" font-family="monospace" font-size="12" letter-spacing="2">SOURCE · PYTHON</text>
<rect x="44" y="148" width="581" height="310" rx="10" fill="#0c1920" stroke="#34535a"/>
<text x="64" y="187" font-size="15" fill="#648891" font-family="monospace">01</text><text x="109" y="187" fill="#e0ecf0" font-size="17" font-family="monospace">values = [2, 4]</text>
<text x="64" y="225" font-size="15" fill="#648891" font-family="monospace">02</text><text x="109" y="225" fill="#e0ecf0" font-size="17" font-family="monospace">alias = values</text>
<rect x="45" y="237" width="579" height="44" fill="#143f42"/><rect x="45" y="237" width="5" height="44" fill="#38d3bd"/>
<text x="64" y="264" font-size="15" fill="#85d9d0" font-family="monospace">03</text><text x="109" y="264" fill="#75e9d2" font-size="17" font-family="monospace">alias.append(6)</text>
<text x="64" y="307" font-size="15" fill="#648891" font-family="monospace">04</text><text x="109" y="307" fill="#e0ecf0" font-size="17" font-family="monospace">print(values)</text>
<path d="M64 329H605" stroke="#29434d"/>
<text x="64" y="363" font-size="12" letter-spacing="1.3" font-family="monospace" fill="#73979e">WHAT HAPPENS NOW</text>
<text x="64" y="392" font-family="Arial,sans-serif" fill="#d2e7e6" font-size="16">Both variables reference the same array.</text>
<text x="64" y="418" font-family="Arial,sans-serif" fill="#d2e7e6" font-size="16">Appending through alias updates the heap object.</text>
<text x="663" y="130" fill="#b3ccd0" font-family="monospace" font-size="12" letter-spacing="2">MEMORY · STEP 03 / 05</text>
