<text x="672" y="266" fill="#a8c2c8" font-family="monospace" font-size="16">alias</text><text x="1004" y="266" fill="#64e1cf" font-family="monospace" font-weight="700" font-size="17">↘ #1</text>
<rect x="647" y="310" width="545" height="148" rx="10" fill="#12252c" stroke="#34535a"/>
