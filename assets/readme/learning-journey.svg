</g><path d="M315 181h24m-7-7 7 7-7 7M611 181h24m-7-7 7 7-7 7M907 181h24m-7-7 7 7-7 7" fill="none" stroke="#7bcfbf" stroke-width="2.5" stroke-linecap="round"/>
