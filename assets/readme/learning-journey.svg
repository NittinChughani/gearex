<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="306" viewBox="0 0 1240 306" role="img" aria-labelledby="title desc"><title id="title">GearEx course completion flow</title><desc id="desc">Four steps: learn a lesson, pass its five-question check, complete the final assessment, and unlock a certificate scored out of 100.</desc>
<rect width="1240" height="306" rx="22" fill="#101d24"/><rect x="20" y="20" width="1200" height="266" rx="14" fill="#172830" stroke="#304b53"/><text x="48" y="60" font-size="13" letter-spacing="2.4" font-weight="700" font-family="monospace" fill="#5fcfbd">GEAREX  /  HOW LEARNING WORKS</text>
<path d="M50 118H1190" stroke="#34535a" stroke-width="2" stroke-dasharray="4 11"/>
<g font-family="Arial,sans-serif">
<rect x="45" y="97" width="270" height="166" rx="12" fill="#20343d" stroke="#3d626b"/><circle cx="78" cy="119" r="18" fill="#0c837e"/><text x="68" y="126" fill="#fff" font-family="monospace" font-size="16" font-weight="700">01</text><text x="67" y="167" font-size="21" font-weight="700" fill="#edf7f5">Learn the concept</text><text x="67" y="196" font-size="15" fill="#b1c8c9">Intro · syntax · example</text><text x="67" y="223" font-size="14" fill="#8caab0">91 guided lessons</text>
<rect x="341" y="97" width="270" height="166" rx="12" fill="#20343d" stroke="#3d626b"/><circle cx="374" cy="119" r="18" fill="#0c837e"/><text x="363" y="126" fill="#fff" font-family="monospace" font-size="16" font-weight="700">02</text><text x="364" y="167" font-size="21" font-weight="700" fill="#edf7f5">Prove understanding</text><text x="364" y="196" font-size="15" fill="#b1c8c9">5 questions per lesson</text><text x="364" y="223" font-size="14" fill="#8caab0">Pass with at least 4 / 5</text>
<rect x="637" y="97" width="270" height="166" rx="12" fill="#20343d" stroke="#3d626b"/><circle cx="670" cy="119" r="18" fill="#0c837e"/><text x="659" y="126" fill="#fff" font-family="monospace" font-size="16" font-weight="700">03</text><text x="660" y="167" font-size="21" font-weight="700" fill="#edf7f5">Final assessment</text><text x="660" y="196" font-size="15" fill="#b1c8c9">Complete your language track</text><text x="660" y="223" font-size="14" fill="#8caab0">Pass with at least 70%</text>
