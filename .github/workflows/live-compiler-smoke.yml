name: Live compiler integration smoke check
on:
  push:
    branches:
      - onlinecompiler-fast-browser-runtime
    paths:
      - .github/workflows/live-compiler-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Socket.IO client for integration check
        run: npm install --no-save --no-package-lock --ignore-scripts socket.io-client@4.8.4
      - name: Run live C++, invalid C++ and Python program with supplied widget key
        run: node scripts/test-onlinecompiler-live.cjs
