name: Live compiler integration smoke check
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/live-compiler-smoke.yml
      - scripts/test-onlinecompiler-live.cjs
      - assets/compiler-service.js
      - assets/compiler-config.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Socket.IO client for integration check
        run: npm install --no-save --no-package-lock --ignore-scripts socket.io-client@4.8.4
      - name: Run Vercel-origin live execution across seven languages
        env:
          GEAREX_TEST_ORIGIN: https://gearex.vercel.app
        run: node scripts/test-onlinecompiler-live.cjs
