name: Validate GearEx
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/data.js
          node --check assets/gearex-courses.js
          node --check assets/challenges.js
          node --check assets/projects.js
          node --check assets/app.js
          node --check assets/lesson-assessments.js
          node --check assets/gearex-engine.js
          node --check assets/gearex-trace-ui.js
          node --check assets/studio-motion.js
          node --check assets/gearex-features.js
      - name: Validate educational content
        run: node scripts/check-content.cjs
      - name: Trace engine unit tests
        run: node --test scripts/test-tracer.cjs
