name: Deploy GearEx account deletion

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/delete-account/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-account-deletion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: erljgeqlntpllyikrvns
    steps:
      - uses: actions/checkout@v4
      - name: Verify Supabase deployment access
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN GitHub Actions secret is missing. The account deletion function was NOT deployed."
            echo "Connect Supabase for direct deployment or add the token as a GitHub Actions repository secret."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy server-only deletion function
        run: supabase functions deploy delete-account --project-ref "$PROJECT_ID" --no-verify-jwt
      - name: Check live function CORS and authentication guard
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${PROJECT_ID}.supabase.co/functions/v1/delete-account"
          headers="$(mktemp)"
          status="$(curl --silent --show-error --location --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --request OPTIONS "$endpoint" --header 'Origin: https://nittinchughani.github.io' --header 'Access-Control-Request-Method: POST' --header 'Access-Control-Request-Headers: authorization,apikey,content-type')"
          if [ "$status" != '200' ]; then
            echo "::error::Edge Function preflight returned HTTP $status, expected 200."
            exit 1
          fi
          grep -qi '^access-control-allow-origin: https://nittinchughani.github.io' "$headers" || { echo "::error::Missing GearEx CORS allowance"; exit 1; }
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST "$endpoint" --header 'Origin: https://nittinchughani.github.io' --header 'Content-Type: application/json' --data '{"confirmation":"DELETE"}')"
          if [ "$status" != '401' ]; then
            echo "::error::Unauthenticated deletion should be rejected with HTTP 401 (got $status)."
            exit 1
          fi
          echo "Deletion endpoint is live, permits GearEx origin and rejects unauthenticated requests."
