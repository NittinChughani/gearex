# Read-only health checks for the ALREADY deployed GearEx deletion function.
# Deployment is managed in Supabase; this workflow never needs an expiring PAT.
name: Verify GearEx account deletion

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/delete-account/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-account-deletion.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live function, CORS, and safe request guards
        shell: bash
        env:
          PROJECT_ID: erljgeqlntpllyikrvns
        run: |
          set -euo pipefail
          endpoint="https://${PROJECT_ID}.supabase.co/functions/v1/delete-account"
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          origin='https://nittinchughani.github.io'
          check_status() {
            local expected="$1"
            shift
            local actual
            actual="$(curl --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 25 --output "$body" --dump-header "$headers" --write-out '%{http_code}' "$@")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Expected HTTP $expected but got HTTP $actual from GearEx deletion endpoint."
              head -c 700 "$body" || true
              exit 1
            fi
          }
          # OPTIONS is safe: checks that a real browser can reach the function.
          check_status 200 --request OPTIONS "$endpoint" \
            --header "Origin: $origin" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,apikey,content-type'
          grep -qi "^access-control-allow-origin: $origin" "$headers" || {
            echo '::error::Missing GearEx Access-Control-Allow-Origin response header.'
            exit 1
          }
          grep -qi '^access-control-allow-headers:.*authorization' "$headers" || {
            echo '::error::Authorization is not permitted by the CORS preflight.'
            exit 1
          }
          echo 'PASS: browser preflight and GearEx CORS origin'

          # No valid bearer token is used. THESE REQUESTS CANNOT DELETE AN ACCOUNT.
          check_status 401 --request POST "$endpoint" \
            --header "Origin: $origin" --header 'Content-Type: application/json' \
            --data '{"confirmation":"DELETE"}'
          echo 'PASS: anonymous deletion is rejected'

          check_status 400 --request POST "$endpoint" \
            --header "Origin: $origin" --header 'Content-Type: application/json' \
            --data '{"confirmation":"NO"}'
          echo 'PASS: explicit DELETE confirmation is required'

          check_status 403 --request OPTIONS "$endpoint" \
            --header 'Origin: https://unauthorized.example' \
            --header 'Access-Control-Request-Method: POST'
          echo 'PASS: unauthorized web origins are rejected'

          check_status 405 --request GET "$endpoint" --header "Origin: $origin"
          echo 'PASS: unsafe HTTP methods are rejected'
          echo 'Live checks passed; no account or user data was changed.'
